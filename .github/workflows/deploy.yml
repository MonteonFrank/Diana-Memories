name: Deploy Diana's Memory Gallery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment artifact
        run: |
          rm -rf dist
          mkdir -p dist

          cp ./*.html dist/
          rsync -a ./assets/ dist/assets/

          python3 - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          root = Path('.')
          dist = root / 'dist'
          html_files = list(root.glob('*.html'))
          js_files = [root / 'assets/js/scripts.js']

          refs = set()
          gallery_full_refs = set()
          for path in html_files + js_files:
            text = path.read_text(encoding='utf-8')
            refs.update(re.findall(r'"(\./[^"?#]+)"', text))
            refs.update(re.findall(r"'(\./[^'?#]+)'", text))

          def add_gallery_refs(parsed):
            images = parsed if isinstance(parsed, list) else parsed.get('images')
            if not isinstance(images, list):
              return

            base_path = parsed.get('basePath', '') if isinstance(parsed, dict) else ''
            thumbs_path = parsed.get('thumbsPath', '') if isinstance(parsed, dict) else ''

            if base_path:
              base_path = base_path.rstrip('/')
            if thumbs_path:
              thumbs_path = thumbs_path.rstrip('/')
            elif base_path:
              thumbs_path = f'{base_path}/thumbs'

            for item in images:
              if isinstance(item, str):
                if base_path:
                  full_ref = f'{base_path}/{item}'
                  refs.add(full_ref)
                  gallery_full_refs.add(full_ref)
                if thumbs_path:
                  refs.add(f'{thumbs_path}/{item}')
                continue

              if not isinstance(item, dict):
                continue

              if isinstance(item.get('thumb'), str):
                refs.add(item['thumb'])
              if isinstance(item.get('full'), str):
                refs.add(item['full'])
                gallery_full_refs.add(item['full'])
              if isinstance(item.get('src'), str):
                refs.add(item['src'])
              if isinstance(item.get('thumbWebp'), str):
                refs.add(item['thumbWebp'])

              file_name = item.get('file')
              if isinstance(file_name, str):
                if base_path:
                  full_ref = f'{base_path}/{file_name}'
                  refs.add(full_ref)
                  gallery_full_refs.add(full_ref)
                if thumbs_path:
                  refs.add(f'{thumbs_path}/{file_name}')

          for path in html_files:
            text = path.read_text(encoding='utf-8')
            for match in re.finditer(r'<script[^>]*type="application/json"[^>]*>(.*?)</script>', text, re.S):
              payload = match.group(1).strip()
              if not payload:
                continue
              try:
                parsed = json.loads(payload)
              except json.JSONDecodeError:
                continue
              add_gallery_refs(parsed)

          media_roots = {'2023', '2024', '2025'}

          def copy_file(src: Path, dest: Path) -> None:
            dest.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(src, dest)

          for ref in sorted(refs):
            if not ref.startswith('./'):
              continue

            rel = Path(ref[2:])
            src = root / rel
            if not src.is_file():
              continue

            if ref in gallery_full_refs and rel.parts and rel.parts[0] in media_roots and 'thumbs' not in rel.parts:
              thumb_src = src.parent / 'thumbs' / src.name
              if thumb_src.is_file():
                copy_file(thumb_src, dist / rel)
                continue

            copy_file(src, dist / rel)
          PY

      - name: Verify artifact size
        run: |
          size_kb=$(du -sk dist | cut -f1)
          max_kb=$((950 * 1024))

          echo "Artifact size: ${size_kb} KB"

          if [ "$size_kb" -gt "$max_kb" ]; then
            echo "Deployment artifact is too large. Expected under 950 MB, got ${size_kb} KB."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4