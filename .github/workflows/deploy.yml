name: Deploy Diana's Memory Gallery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment artifact
        run: |
          rm -rf dist
          mkdir -p dist

          cp ./*.html dist/
          rsync -a ./assets/ dist/assets/

          python3 - <<'PY'
          import re
          import shutil
          from pathlib import Path

          root = Path('.')
          dist = root / 'dist'
          html_files = list(root.glob('*.html'))
          js_files = [root / 'assets/js/scripts.js']

          refs = set()
          for path in html_files + js_files:
            text = path.read_text(encoding='utf-8')
            refs.update(re.findall(r'"(\./[^"?#]+)"', text))
            refs.update(re.findall(r"'(\./[^'?#]+)'", text))

          media_roots = {'2023', '2024', '2025'}

          def copy_file(src: Path, dest: Path) -> None:
            dest.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(src, dest)

          for ref in sorted(refs):
            if not ref.startswith('./'):
              continue

            rel = Path(ref[2:])
            src = root / rel
            if not src.is_file():
              continue

            if rel.parts and rel.parts[0] in media_roots and 'thumbs' not in rel.parts:
              thumb_src = src.parent / 'thumbs' / src.name
              if thumb_src.is_file():
                copy_file(thumb_src, dist / rel)
                continue

            copy_file(src, dist / rel)
          PY

      - name: Verify artifact size
        run: |
          size_kb=$(du -sk dist | cut -f1)
          max_kb=$((950 * 1024))

          echo "Artifact size: ${size_kb} KB"

          if [ "$size_kb" -gt "$max_kb" ]; then
            echo "Deployment artifact is too large. Expected under 950 MB, got ${size_kb} KB."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4