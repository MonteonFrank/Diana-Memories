<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <header class="header">
    <p class="header-kicker">Your Picks</p>
    <h1>Favorites</h1>
    <p class="header-subtitle">Tap the heart icon on any album photo to save it here. Your selections are stored on this device.</p>
  </header>

  <div id="site-nav"></div>

  <div class="favorites-toolbar">
    <button id="clear-favorites" class="favorites-clear" type="button">Clear Favorites</button>
  </div>

  <p id="favorites-empty" class="favorites-empty" hidden>No favorite photos yet. Open any album and tap the heart icon on pictures you love.</p>

  <div id="favorites-album" class="photo-album"></div>

  <div id="lightbox" class="lightbox" style="display: none;" onclick="closeLightbox()">
    <img id="lightbox-img" alt="Enlarged Image">
  </div>

  <script src="./assets/js/scripts.js"></script>
</body>

</html>
