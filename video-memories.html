<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Memories</title>
  <link rel="stylesheet" href="./assets/css/video-memories.css">
</head>

<body>
  <header class="header">
    <p class="header-kicker">Diana Memories</p>
    <h1>Video Memories</h1>
    <p class="header-subtitle">A curated collection of short family moments, milestones, and celebrations captured on video.</p>
  </header>

  <div id="site-nav"></div>

  <main>
    <section class="video-memories-section" aria-label="Video Memories">
      <div class="video-grid">
        <article class="video-card">
          <div class="video-frame">
            <video
              controls
              preload="metadata"
              playsinline
              webkit-playsinline="true"
            >
              <source src="https://res.cloudinary.com/cowmdyed/video/upload/f_mp4,vc_h264,ac_aac,q_auto/v1786495914/IMG_4780_1.mov" type="video/mp4">
              <source src="https://res.cloudinary.com/cowmdyed/video/upload/v1786495914/IMG_4780_1.mov" type="video/quicktime">
              Your browser does not support the video tag.
            </video>
          </div>
          <h2>Diana's First Time in the Pool</h2>
          <p class="video-date">May 1st, 2024</p>
        </article>
      </div>
    </section>
  </main>

  <script src="./assets/js/scripts.js"></script>
</body>

</html>
